<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>YourCravings</title>
    <script>const segmentCount = 1;

        const pathSegments = window.location.pathname
            .split('/')
            .filter(segment => segment.length > 0);

        const route = pathSegments.slice(segmentCount).join('/');

        const redirectUrl =
            window.location.origin +
            '/' + pathSegments.slice(0, segmentCount).join('/') +
            '/?/' + route +
            window.location.search.replace(/&/g, '~and~') +
            window.location.hash;

        window.location.replace(redirectUrl);</script>
</head>
<body>
</body>
</html>
